name: Static game checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-tablet
            browser: chromium
          - project: webkit-tablet
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:graphics
      - run: git diff --exit-code -- graphics-lab/app.bundle.js graphics-lab/asset-manifest.json
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
