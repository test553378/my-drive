S.roll+=(-S.steerV*.012-S.roll)*Math.min(1,dt*6);S.pitch+=((S.v-prevV)*-.016-S.pitch)*Math.min(1,dt*7);
for(let r of ai){r.z+=r.v*dt;if(Math.abs(r.z-S.z)<3.6&&Math.abs(r.l-S.offset)<2.45&&S.time-S.hit>2.0){S.hit=S.time;S.v*=.53;S.shake=.45;S.offset+=S.offset>r.l?1.0:-1.0;toast('ぶつかった！');beep(170);}}
if(offroad&&S.time-S.hit>4&&Math.random()<dt*.28)toast('コースに もどろう！');
S.shake*=Math.max(0,1-dt*5);metric();if(S.z>=TOTAL){S.z=TOTAL;metric();finish();}}
function carAt(z,offset,col,spd,anim,player){let x=center(z)+offset,y=.17+.022*Math.sin(anim*15),yaw=Math.atan(slope(z))+(player?S.steerV*.016:0),roll=player?S.roll:0,pitch=player?S.pitch:0;
draw(shadow,x,.067,z,yaw);draw(bodies[col],x,y,z,yaw,0,roll,pitch);
for(let wheelZ of [-1.67,1.63])for(let side of [-1,1]){let xx=side*1.14,zz=wheelZ,wx=x+Math.cos(yaw)*xx+Math.sin(yaw)*zz,wz=z-Math.sin(yaw)*xx+Math.cos(yaw)*zz;draw(wheel,wx,y+.47,wz,yaw,-anim*spd/.56);}}
function drawSky(t){gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.useProgram(skyp);gl.bindBuffer(gl.ARRAY_BUFFER,skybuf);gl.enableVertexAttribArray(skLoc.p);gl.vertexAttribPointer(skLoc.p,2,gl.FLOAT,false,0,0);gl.uniform1f(skLoc.t,t);gl.drawArrays(gl.TRIANGLES,0,3);gl.depthMask(true);gl.enable(gl.DEPTH_TEST);}
function render(timestamp){resize();let dt=Math.min(.045,(timestamp-S.prev)/1000||0);S.prev=timestamp;update(dt);applyAudio();
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);drawSky(timestamp*.001);gl.clear(gl.DEPTH_BUFFER_BIT);gl.useProgram(prog);
const z=S.z,x=center(z)+S.offset,speedShake=S.phase==='race'?(.023*Math.sin(timestamp*.043)*S.v/45):0;
S.camX+=(x-S.camX)*Math.min(1,dt*3.9);S.camZ+=(z-S.camZ)*Math.min(1,dt*6.2);
const pitch=S.boost>0?4.3:4.85;S.camH+=(pitch-S.camH)*Math.min(1,dt*2.4);
const eye=[S.camX+S.roll*2+(Math.random()-.5)*S.shake,S.camH+speedShake,S.camZ-12.5+(S.boost>0?1:0)],aim=[center(z+38)*.64+x*.36,1.10,z+34];
const view=mul(perspective((62+(S.boost>0?7:0))*Math.PI/180,WIDTH/HEIGHT,.12,435),lookAt(eye,aim));
gl.uniformMatrix4fv(loc.vp,false,view);gl.uniform3fv(loc.eye,new Float32Array(eye));gl.uniform1f(loc.time,timestamp*.001);
const step=Math.floor(z/LAP);for(let i=step-1;i<=step+1;i++){draw(road,0,0,i*LAP);draw(deco,0,0,i*LAP);}
for(const r of ai){if(r.z>z-35&&r.z<z+240)carAt(r.z,r.l,r.c,r.v,r.z/44,false);}
carAt(z,S.offset,S.color,Math.max(1,S.v),z/Math.max(1,S.v),true);
if($('toast').classList.contains('show')&&timestamp>toastEnd)$('toast').classList.remove('show');
requestAnimationFrame(render);}
requestAnimationFrame(render);
for(const b of document.querySelectorAll('.swatch'))b.addEventListener('click',()=>{S.color=Number(b.dataset.color);document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x===b));});
$('start').addEventListener('click',()=>{if(S.phase==='pause')resume();else reset();});$('pause').addEventListener('click',pause);
function control(id,field){let el=$(id),down=e=>{e.preventDefault();if(S.phase!=='race')return;S[field]=true;el.classList.add('is-down');try{el.setPointerCapture(e.pointerId);}catch(_){}},up=e=>{e.preventDefault();S[field]=false;el.classList.remove('is-down');};el.addEventListener('pointerdown',down);for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,up);}
control('left','steerL');control('right','steerR');
function boost(){if(S.phase!=='race'||S.charge<60||S.boost>0)return;S.charge=0;S.boost=2.55;toast('⚡ TURBO!');beep(700);metric();}
$('boost').addEventListener('pointerdown',e=>{e.preventDefault();boost();});
$('sound').addEventListener('click',()=>{mute=!mute;$('sound').textContent=mute?'🔇':'🔊';initAudio();});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Space','Escape'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')S.steerL=true;if(e.key==='ArrowRight')S.steerR=true;if(e.key===' '||e.key==='Space')boost();if(e.key==='Escape')pause();}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')S.steerL=false;if(e.key==='ArrowRight')S.steerR=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.phase==='race')pause();});
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
metric();
})();

</script></body></html>
