<script>
(()=>{'use strict';
const $=x=>document.getElementById(x),canvas=$('world');let gl=null;
try{gl=canvas.getContext('webgl',{antialias:true,alpha:false,powerPreference:'default'})||canvas.getContext('experimental-webgl',{antialias:true,alpha:false});}catch(e){}

const vsrc=`attribute vec3 aPos;attribute vec3 aNormal;attribute vec3 aColor;uniform mat4 uVP;uniform vec3 uShift;uniform float uYaw;varying vec3 vColor;varying float vFog;uniform vec3 uEye;void main(){float c=cos(uYaw),s=sin(uYaw);vec3 p=vec3(c*aPos.x+s*aPos.z,aPos.y,-s*aPos.x+c*aPos.z)+uShift;vec3 n=normalize(vec3(c*aNormal.x+s*aNormal.z,aNormal.y,-s*aNormal.x+c*aNormal.z));float light=max(dot(n,normalize(vec3(-0.35,0.95,0.35))),0.0);vColor=aColor*(0.70+0.30*light);vFog=clamp((length(p-uEye)-95.0)/310.0,0.0,1.0);gl_Position=uVP*vec4(p,1.0);}`;

function shader(kind,src){const s=gl.createShader(kind);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
let prog;try{prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vsrc));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fsrc));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));}catch(e){$('unsupported').classList.add('visible');console.error(e);return;}
gl.useProgram(prog);const atP=gl.getAttribLocation(prog,'aPos'),atN=gl.getAttribLocation(prog,'aNormal'),atC=gl.getAttribLocation(prog,'aColor');const uniVP=gl.getUniformLocation(prog,'uVP'),uniShift=gl.getUniformLocation(prog,'uShift'),uniYaw=gl.getUniformLocation(prog,'uYaw'),uniEye=gl.getUniformLocation(prog,'uEye');gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearColor(.63,.85,.95,1);
const C=(r,g,b)=>[r/255,g/255,b/255],BLACK=C(22,28,43),GLASS=C(40,108,144),SILVER=C(213,222,230),GRASS=C(98,184,118);

function dark(c,f){return c.map(v=>v*f)}
class Mesh{constructor(){this.data=[];this.buffer=null;this.count=0;} tri(a,b,c,col){let A=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],B=[c[0]-a[0],c[1]-a[1],c[2]-a[2]],n=[A[1]*B[2]-A[2]*B[1],A[2]*B[0]-A[0]*B[2],A[0]*B[1]-A[1]*B[0]];let d=Math.hypot(...n)||1;n=n.map(x=>x/d);for(let p of [a,b,c])this.data.push(...p,...n,...col);}quad(a,b,c,d,color){this.tri(a,b,c,color);this.tri(a,c,d,color);}box(x,y,z,w,h,l,col){const x0=x-w/2,x1=x+w/2,y0=y-h/2,y1=y+h/2,z0=z-l/2,z1=z+l/2;this.quad([x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0],col);this.quad([x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[x0,y0,z1],col);this.quad([x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[x0,y0,z0],col);this.quad([x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],col);this.quad([x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],col);this.quad([x0,y0,z1],[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],col);}pyramid(x,y,z,r,h,col){let apex=[x,y+h,z];for(let i=0;i<6;i++){let a=i*Math.PI/3,b=(i+1)*Math.PI/3;this.tri([x+r*Math.cos(a),y,z+r*Math.sin(a)],[x+r*Math.cos(b),y,z+r*Math.sin(b)],apex,col);}}
finish(){this.count=this.data.length/9;this.buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,this.buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(this.data),gl.STATIC_DRAW);this.data=[];return this;}}
function draw(mesh,x=0,y=0,z=0,yaw=0){gl.bindBuffer(gl.ARRAY_BUFFER,mesh.buffer);let stride=9*4;gl.enableVertexAttribArray(atP);gl.vertexAttribPointer(atP,3,gl.FLOAT,false,stride,0);gl.enableVertexAttribArray(atN);gl.vertexAttribPointer(atN,3,gl.FLOAT,false,stride,12);gl.enableVertexAttribArray(atC);gl.vertexAttribPointer(atC,3,gl.FLOAT,false,stride,24);gl.uniform3f(uniShift,x,y,z);gl.uniform1f(uniYaw,yaw);gl.drawArrays(gl.TRIANGLES,0,mesh.count);}
const LAP=1300,TOTAL=LAP*2,WIDE=8.7,TAU=2*Math.PI;
function center(z){return 12*Math.sin(z*TAU/LAP)+6.3*Math.sin(z*TAU*2/LAP+.4)+3.3*Math.sin(z*TAU*3/LAP+.8)}
function slope(z){return (center(z+1)-center(z-1))*.5;}
const road=new Mesh(),decor=new Mesh();
function seeded(n){let v=Math.sin(n*127.71+44.39)*48711.12;return v-Math.floor(v)}
function street(){for(let z=0;z<LAP;z+=5){const zz=Math.min(LAP,z+5),cx=center(z),nx=center(zz);let g1=z%30<15?C(86,185,115):C(94,191,119);road.quad([cx-160,-.12,z],[nx-160,-.12,zz],[nx+160,-.12,zz],[cx+160,-.12,z],g1);road.quad([cx-WIDE-2,0,z],[nx-WIDE-2,0,zz],[nx+WIDE+2,0,zz],[cx+WIDE+2,0,z],C(221,199,129));road.quad([cx-WIDE,.06,z],[nx-WIDE,.06,zz],[nx+WIDE,.06,zz],[cx+WIDE,.06,z],z%60<30?C(66,76,93):C(62,72,89));for(let side of [-1,1]){let x=cx+side*(WIDE+.22),xn=nx+side*(WIDE+.22),col=(Math.floor(z/10)%2===0)?C(249,95,80):C(255,249,237);road.quad([x-side*.43,.09,z],[xn-side*.43,.09,zz],[xn+side*.43,.09,zz],[x+side*.43,.09,z],col);}
if(z%30===0){road.quad([cx-.15,.10,z],[cx-.15,.10,z+12],[cx+.15,.10,z+12],[cx+.15,.10,z],C(247,239,182));}}
for(let x=-8;x<8;x+=2)for(let z=0;z<5;z+=2){let c=(x/2+z/2)%2===0?C(255,252,246):C(26,31,48);road.quad([center(z)+x,.14,z],[center(z)+x,.14,z+2],[center(z)+x+2,.14,z+2],[center(z)+x+2,.14,z],c);}
for(let i=0;i<35;i++){let z=i*37+8;for(let sign of [-1,1]){const c=center(z),dist=17+seeded(i*13+sign*11)*17,x=c+sign*dist;const v=seeded(i*47+sign*3);if(v<.62){decor.box(x,1.4,z,1.1,2.8,1.1,C(132,108,79));decor.pyramid(x,2.6,z,3.9,7.3,v<.2?C(65,153,119):C(54,143,90));decor.pyramid(x,5,z,3.0,5.2,C(56,166,104));}else if(v<.85){const h=4+seeded(i+8)*6;decor.box(x,h/2,z,5,h,5,v<.75?C(230,197,132):C(132,197,229));decor.box(x,h+.5,z,5.6,1,5.6,C(247,111,99));}else{decor.pyramid(x,.2,z,2.4,2.7,C(141,158,150));}
if(i%3===0){const b=c+sign*12;decor.box(b,1.7,z,.35,3.4,.35,C(238,236,213));decor.box(b-sign*.7,3.4,z,1.5,1.1,.25,i%2?C(255,196,68):C(94,173,255));}}}
// barrier rails alongside the outside of the circuit
for(let z=0;z<LAP;z+=15){for(let s of [-1,1]){const x=center(z)+s*12,nx=center(z+15)+s*12;decor.box(x,.65,z,.24,1.3,.24,C(241,241,237));decor.quad([x,.84,z],[nx,.84,z+15],[nx,1.17,z+15],[x,1.17,z],C(203,222,229));}}
road.finish();decor.finish();}
street();
function carMesh(col){const m=new Mesh(),deep=dark(col,.72),lite=col.map(v=>Math.min(v*1.14,1));
// 4 visible low-profile tires, rims, and rear wing
for(let z of [-1.45,1.45])for(let s of [-1,1]){m.box(s*1.18,.49,z,.65,.96,1.04,BLACK);m.box(s*1.52,.48,z,.06,.53,.57,C(152,169,177));m.box(s*1.57,.48,z,.07,.20,.22,C(232,238,242));}
m.box(0,.54,0,2.25,.66,4.92,col);
// angular sports car bonnet, front and rear body wedge
m.quad([-1.13,.87,.35],[1.13,.87,.35],[.95,.66,2.47],[-.95,.66,2.47],lite);m.quad([-1.12,.90,-2.42],[1.12,.90,-2.42],[1.04,.91,-.80],[-1.04,.91,-.80],lite);
// side skirts and front splitter
m.box(0,.25,2.37,2.23,.19,.34,BLACK);m.box(0,.31,-2.35,2.14,.15,.3,deep);for(let s of [-1,1])m.box(s*1.12,.28,0,.23,.18,3.9,deep);
// slanted cockpit (roof and panoramic windshield)
const rearL=[-.83,.98,-1.45],rearR=[.83,.98,-1.45],roofRL=[-.73,1.77,-.72],roofRR=[.73,1.77,-.72],roofFL=[-.69,1.74,.43],roofFR=[.69,1.74,.43],frontL=[-.94,.93,1.18],frontR=[.94,.93,1.18];
m.quad(rearL,rearR,roofRR,roofRL,GLASS);m.quad(roofRL,roofRR,roofFR,roofFL,deep);m.quad(roofFL,roofFR,frontR,frontL,GLASS);m.quad(rearL,roofRL,roofFL,frontL,C(42,114,155));m.quad(rearR,frontR,roofFR,roofRR,C(29,97,143));
// sporty accent bonnet strip
m.quad([-.18,.89,1.32],[.18,.89,1.32],[.12,.70,2.25],[-.12,.70,2.25],C(245,246,240));
// triangular headlights and rear lights
for(let s of [-1,1]){m.box(s*.80,.68,2.49,.59,.13,.08,C(255,248,186));m.box(s*.77,.78,-2.51,.59,.16,.08,C(255,65,68));m.box(s*1.1,.99,-1.15,.15,.13,.30,deep);}
m.box(0,1.54,-2.23,2.73,.14,.44,deep);for(let s of [-1,1])m.box(s*.94,1.24,-2.24,.16,.65,.22,deep);
return m.finish();}
const cars=palette.map(carMesh);const starMesh=new Mesh();for(let p of [[0,0,0]]){for(let i=0;i<8;i++){let a=i*TAU/8,b=(i+1)*TAU/8;const r=i%2===0?1.02:.48,rb=(i+1)%2===0?1.02:.48;starMesh.tri([0,.32,0],[Math.cos(a)*r,0,Math.sin(a)*r],[Math.cos(b)*rb,0,Math.sin(b)*rb],C(255,231,79));starMesh.tri([0,-.34,0],[Math.cos(b)*rb,0,Math.sin(b)*rb],[Math.cos(a)*r,0,Math.sin(a)*r],C(247,179,40));}}starMesh.finish();
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=f/aspect;o[5]=f;o[10]=(far+near)/(near-far);o[11]=-1;o[14]=(2*far*near)/(near-far);return o;}
function lookAt(e,t){const sub=(a,b)=>a.map((x,i)=>x-b[i]),norm=v=>{let d=Math.hypot(...v)||1;return v.map(x=>x/d)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((v,x,i)=>v+x*b[i],0);let f=norm(sub(t,e)),s=norm(cross(f,[0,1,0])),u=cross(s,f);return new Float32Array([s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-dot(s,e),-dot(u,e),dot(f,e),1]);}
function multiply(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o;}
let W=0,H=0;function resize(){let dpr=Math.min(devicePixelRatio||1,1.6),iw=innerWidth,ih=innerHeight,scale=Math.min(1,1500/(iw*dpr));let w=Math.max(1,Math.round(iw*dpr*scale)),h=Math.max(1,Math.round(ih*dpr*scale));if(w!==W||h!==H){W=w;H=h;canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}addEventListener('resize',resize);resize();
const state={phase:'menu',z:0,x:center(0),speed:0,steerL:false,steerR:false,boost:0,charge:100,stars:0,lap:1,rank:5,color:0,prev:0,freezeAt:0,lastCollision:-99,clock:0,camX:0,toastUntil:0};
const rivals=Array.from({length:4},(_,i)=>({z:[100,68,40,16][i],spd:[36.5,35.6,35.2,34.3][i],lane:[-3,2.9,3.8,-2.4][i],col:[1,2,3,4][i]}));
const coins=Array.from({length:42},(_,i)=>({z:45+i*61.2,lane:[-5,0,5,2,-3][i%5],taken:false}));
function hud(){state.lap=Math.min(2,1+Math.floor(state.z/LAP));state.rank=1+rivals.filter(r=>r.z>state.z).length;$('lap').textContent=`${state.lap} / 2`;$('rank').textContent=`${state.rank} / 5`;$('stars').textContent=state.stars;$('progressbar').style.width=`${Math.min(100,100*state.z/TOTAL).toFixed(2)}%`;$('speed').textContent='スピード '+Math.round(state.speed*3);$('boostmeter').style.width=state.charge+'%';$('boost').disabled=state.charge<60 ||state.phase!=='race';}
let audio=null;function sound(kind){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();audio.resume();const t=audio.currentTime;const tones=kind==='coin'?[680,930]:kind==='boost'?[440,660,880]:kind==='win'?[520,650,790,1050]:[240,150];tones.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'sawtooth':'sine';o.frequency.value=f;let on=t+i*.09;g.gain.setValueAtTime(.0001,on);g.gain.exponentialRampToValueAtTime(.07,on+.01);g.gain.exponentialRampToValueAtTime(.0001,on+.13);o.connect(g);g.connect(audio.destination);o.start(on);o.stop(on+.14);});}catch(e){}}
let toastTid=0;function toast(s){clearTimeout(toastTid);$('toast').textContent=s;$('toast').classList.add('show');toastTid=setTimeout(()=>$('toast').classList.remove('show'),1100);}
function start(){state.phase='race';state.z=0;state.x=center(0);state.speed=0;state.steerL=state.steerR=false;state.boost=0;state.charge=100;state.stars=0;state.clock=0;state.lastCollision=-99;state.camX=state.x;for(let i=0;i<rivals.length;i++){rivals[i].z=[100,68,40,16][i];rivals[i].lane=[-3,2.9,3.8,-2.4][i];}coins.forEach(c=>c.taken=false);$('modal').classList.add('hidden');$('pause').textContent='⏸';hud();}
function finish(){state.phase='finish';state.steerL=state.steerR=false;sound('win');$('modal').classList.remove('hidden');$('kicker').textContent='🏁 ゴール！ おめでとう！';$('title').innerHTML=state.rank===1?'🏆 <em>1い！</em>':'🏎️ <em>ゴール！</em>';$('subtitle').textContent=`${state.rank}い / 5だい　⭐ ${state.stars}こ あつめたよ！`;$('choose').textContent='ちがういろでも ちょうせんできるよ！';$('start').textContent='↻ もういっかい！';$('instructions').textContent='なんかいでも れんしゅうできるよ！';}
function tick(dt){if(state.phase!=='race')return;state.clock+=dt;state.boost=Math.max(0,state.boost-dt);state.charge=Math.min(100,state.charge+dt*9);const steer=(state.steerR?1:0)-(state.steerL?1:0);let out=Math.abs(state.x-center(state.z));let target=(out>WIDE?19:37)+(state.boost>0?21:0);state.speed+=(target-state.speed)*Math.min(1,dt*1.8);let dz=state.speed*dt,old=center(state.z);state.z+=dz;state.x-=steer*dt*16-(.65*(center(state.z)-old));state.x=Math.max(center(state.z)-16,Math.min(center(state.z)+16,state.x));
if(out>WIDE+1&&Math.random()<dt*.60)toast('🌿 コースに もどろう！');
for(let r of rivals){r.z+=r.spd*dt;if(state.clock-state.lastCollision>1.9&&Math.abs(r.z-state.z)<3.6&&Math.abs(center(r.z)+r.lane-state.x)<2.5){state.lastCollision=state.clock;state.speed*=.55;state.x+=state.x>center(r.z)+r.lane?1.2:-1.2;toast('💥 ぶつかった！ がんばれ！');sound('hit');}}
for(let c of coins){if(!c.taken&&Math.abs(c.z-state.z)<2.7&&Math.abs(center(c.z)+c.lane-state.x)<2.3){c.taken=true;state.stars++;toast('⭐ ゲット！');sound('coin');}}
state.camX+=(state.x-state.camX)*Math.min(1,dt*3.3);hud();if(state.z>=TOTAL){state.z=TOTAL;hud();finish();}}
function render(t){resize();const dt=Math.min(.045,(t-state.prev)/1000||0);state.prev=t;tick(dt);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const eye=[state.camX,8.9,state.z-19.0],at=[center(state.z+30)*.40+state.x*.60,1.8,state.z+22];const vp=multiply(perspective(Math.PI/3.2,W/H,.15,580),lookAt(eye,at));gl.uniformMatrix4fv(uniVP,false,vp);gl.uniform3fv(uniEye,new Float32Array(eye));const k=Math.floor(state.z/LAP);for(let i=k-1;i<=k+1;i++){draw(road,0,0,i*LAP);draw(decor,0,0,i*LAP);}
for(let c of coins){if(!c.taken&&c.z>state.z-10&&c.z<state.z+220)draw(starMesh,center(c.z)+c.lane,2.6,c.z,t*.0017);}
for(let r of rivals){if(r.z>state.z-30&&r.z<state.z+240)draw(cars[r.col],center(r.z)+r.lane,.12,r.z,Math.atan(slope(r.z)));}
const turn=(state.steerR?1:0)-(state.steerL?1:0);draw(cars[state.color],state.x,.12,state.z,Math.atan(slope(state.z)) - turn*.08);
requestAnimationFrame(render);}requestAnimationFrame(render);
for(const b of document.querySelectorAll('.swatch'))b.addEventListener('click',()=>{state.color=Number(b.dataset.color);document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x===b));});$('start').addEventListener('click',()=>{if(state.phase==='pause'){resume();}else{sound('coin');start();}});
$('pause').addEventListener('click',()=>{if(state.phase==='race'){state.phase='pause';state.steerL=state.steerR=false;$('pause').textContent='▶';$('modal').classList.remove('hidden');$('kicker').textContent='ちょっと やすもう';$('title').innerHTML='⏸ <em>おやすみ</em>';$('subtitle').textContent='じゅんびが できたら つづけよう';$('start').textContent='▶ つづきから！';$('choose').textContent='くるまの いろも かえられるよ！';$('instructions').textContent='◀ ▶ で ハンドル ／ ⚡ で ブースト';}else if(state.phase==='pause'){resume();}});
function resume(){state.phase='race';$('modal').classList.add('hidden');$('pause').textContent='⏸';hud();}
function controls(id,field){const b=$(id);const down=e=>{e.preventDefault();if(state.phase!=='race')return;state[field]=true;b.classList.add('is-down');try{b.setPointerCapture(e.pointerId);}catch(_){}};const up=e=>{e.preventDefault();state[field]=false;b.classList.remove('is-down');};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up));}
controls('left','steerL');controls('right','steerR');
$('boost').addEventListener('pointerdown',e=>{e.preventDefault();if(state.phase==='race'&&state.charge>=60&&state.boost<=0){state.charge=0;state.boost=2.5;toast('⚡ スーパーブースト！');sound('boost');hud();}});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Space'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')state.steerL=true;if(e.key==='ArrowRight')state.steerR=true;if(e.key===' '&&state.charge>=60&&state.phase==='race'){state.charge=0;state.boost=2.5;}}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')state.steerL=false;if(e.key==='ArrowRight')state.steerR=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='race'){$('pause').click();}});
// A separate versioned service worker prevents an earlier cached game from persisting.
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(()=>{});});
hud();
})();
</script></body></html>
